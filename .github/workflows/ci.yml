name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Build the Windows app by hand and publish it as a release: gh workflow run, input "tag".
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the Windows installer under (v0.11.0)
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-locales -w frontend
      - run: npm run build
      - name: Desktop app (typecheck and bundle)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --prefix desktop
          npm run typecheck --prefix desktop
          npm run build --prefix desktop

  image:
    # Publish the Docker image for ZimaOS on every push to main and on tags.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zimamc
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    # The Windows app (installer). Built on every push; a version tag or the "tag" input also publishes a release,
    # which the installed apps pick up as an automatic update.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist --prefix desktop
      - name: Servers without Docker (a real Paper server)
        run: node desktop/scripts/smoke-native.mjs PAPER
      - name: Servers without Docker (a real Fabric server)
        run: node desktop/scripts/smoke-native.mjs FABRIC
      - name: The app starts and shows ZimaMC
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\smoke.json"
          $env:ZIMAMC_SMOKE = $out
          $env:DATA_DIR = "$env:RUNNER_TEMP\zimamc-app"
          $p = Start-Process desktop\release\win-unpacked\ZimaMC.exe -PassThru
          for ($i = 0; $i -lt 90 -and -not (Test-Path $out); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $out)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "the app did not open its window" }
          Get-Content $out
          if ((Get-Content $out -Raw) -notmatch '"title":"ZimaMC') { throw "unexpected page" }
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "the app did not quit" }
      - uses: actions/upload-artifact@v4
        with:
          name: ZimaMC-windows
          path: |
            desktop/release/ZimaMC-Setup-*.exe
            desktop/release/ZimaMC-Setup-*.exe.blockmap
            desktop/release/latest.yml
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files=(desktop/release/ZimaMC-Setup-*.exe desktop/release/ZimaMC-Setup-*.exe.blockmap desktop/release/latest.yml)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "ZimaMC ${TAG#v}" --notes-file docs/release-notes.md
          fi

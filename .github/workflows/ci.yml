name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Build the Windows app by hand and attach it to an existing release: gh workflow run, input "tag".
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach ZimaMC.exe to
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-locales -w frontend
      - run: npm run build

  image:
    # Publish the Docker image for ZimaOS on every push to main and on tags.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zimamc
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    # The single-file Windows app. Built on every push; a version tag (v0.9.0) also publishes it as a release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:app
      - name: Smoke test
        shell: pwsh
        env:
          PORT: "8798"
          NO_BROWSER: "1"
          DATA_DIR: ${{ runner.temp }}\zimamc-smoke
        run: |
          $p = Start-Process -FilePath .\dist-app\ZimaMC.exe -PassThru -RedirectStandardOutput smoke.log
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { $r = Invoke-RestMethod http://127.0.0.1:8798/api/status; break } catch { Start-Sleep 1 }
            }
            if (-not $r) { Get-Content smoke.log; throw "ZimaMC.exe did not answer" }
            $r | ConvertTo-Json
            $page = Invoke-WebRequest http://127.0.0.1:8798/ -UseBasicParsing
            if ($page.Content -notmatch "<html") { throw "web interface missing" }
          } finally { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: ZimaMC-windows
          path: dist-app/ZimaMC.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist-app/ZimaMC.exe --clobber
          else
            gh release create "$TAG" dist-app/ZimaMC.exe --title "ZimaMC ${TAG#v}" --notes-file docs/release-notes.md
          fi
